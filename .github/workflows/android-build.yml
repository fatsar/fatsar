name: Android CI

on:
  push:
    branches: ["main", "claude/**"]
  workflow_dispatch:

jobs:
  build:
    name: Test ve APK Derleme
    runs-on: ubuntu-latest
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4

      - name: JDK 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK kur
        uses: android-actions/setup-android@v3

      - name: Vosk model önbelleği
        id: model-cache
        uses: actions/cache@v4
        with:
          path: vosk-models
          key: vosk-models-tr-0.3-en-us-0.15

      - name: Vosk modellerini indir (Türkçe + İngilizce)
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p vosk-models
          for m in vosk-model-small-tr-0.3 vosk-model-small-en-us-0.15; do
            curl -fSL --retry 4 --retry-delay 3 \
              -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36" \
              -o "vosk-models/$m.zip" "https://alphacephei.com/vosk/models/$m.zip"
          done

      - name: Modelleri APK varlıklarına yerleştir (tek ZIP dosyası olarak)
        run: |
          mkdir -p toplanti/src/main/assets/models
          cp vosk-models/*.zip toplanti/src/main/assets/models/
          ls -lh toplanti/src/main/assets/models/

      - name: Birim testlerini çalıştır
        run: ./gradlew --no-daemon :app:testDebugUnitTest :toplanti:testDebugUnitTest

      - name: Debug APK derle
        run: ./gradlew --no-daemon :app:assembleDebug :toplanti:assembleDebug

      - name: APK bilgisi
        run: ls -lh app/build/outputs/apk/debug/ toplanti/build/outputs/apk/debug/

      - name: Kartvizit APK artefaktını yükle
        uses: actions/upload-artifact@v4
        with:
          name: kartvizit-tarayici-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Toplantı Asistanı APK artefaktını yükle
        uses: actions/upload-artifact@v4
        with:
          name: toplanti-asistani-debug-apk
          path: toplanti/build/outputs/apk/debug/toplanti-debug.apk

      - name: Test raporunu yükle (hata durumunda)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-raporu
          path: |
            app/build/reports/
            toplanti/build/reports/
