name: Hermes arayüz testi (emülatör)

# APK yayınını bloke etmemesi için ayrı iş akışı: burada uygulama gerçek bir
# Android emülatöründe açılır ve "bağlantı ekle → bot oluştur → sohbet" akışı denenir.
# Emülatör koşucuları yavaş ve zaman zaman takılıyor; bu yüzden yalnızca elle
# tetiklenir. Her derlemedeki arayüz doğrulaması Robolectric testleriyle yapılır
# (hermes.yml içinde :app:testDebugUnitTest).
on:
  workflow_dispatch:

jobs:
  emulator:
    name: Emülatörde uçtan uca akış
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4

      - name: JDK 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK kur
        uses: android-actions/setup-android@v3

      - name: Gradle önbelleği
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('hermes/android/**/*.gradle.kts') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: KVM erişimini aç
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emülatörde arayüz testleri
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_5
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./gradlew --no-daemon :app:connectedDebugAndroidTest
          working-directory: hermes/android

      - name: Test raporu (hata durumunda)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-test-raporu
          path: hermes/android/app/build/reports/androidTests/
