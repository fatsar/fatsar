<title>Dünya Metrik Atlası</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  color-scheme: light;
  --plane:#eaeef3; --surface:#ffffff; --surface-2:#f5f7fa; --surface-3:#eef2f7;
  --ink:#0f1419; --ink-2:#4d5866; --ink-3:#7d8998;
  --line:#dde3ea; --line-soft:#e9edf2;
  --ocean:#e4e9f0; --graticule:#d3dbe4; --nodata:#ccd4dd; --land-stroke:#ffffff;
  --accent:#1c5cab; --accent-soft:rgba(28,92,171,.10);
  --shadow:0 1px 2px rgba(15,20,25,.06), 0 8px 24px rgba(15,20,25,.08);
  --c1:#cde2fb; --c2:#9ec5f4; --c3:#6da7ec; --c4:#3987e5;
  --c5:#256abf; --c6:#1c5cab; --c7:#184f95; --c8:#0d366b;
  --on-hi:#ffffff;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --plane:#0b0e13; --surface:#141922; --surface-2:#1a202a; --surface-3:#222936;
    --ink:#f2f6fa; --ink-2:#a9b5c5; --ink-3:#7b8797;
    --line:#252c38; --line-soft:#1e242e;
    --ocean:#0f141b; --graticule:#1c2430; --nodata:#2b323e; --land-stroke:#0d1218;
    --accent:#6da7ec; --accent-soft:rgba(109,167,236,.14);
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.45);
    --c1:#14355f; --c2:#17518f; --c3:#1c5cab; --c4:#2a78d6;
    --c5:#3987e5; --c6:#5598e7; --c7:#86b6ef; --c8:#cde2fb;
    --on-hi:#0b1622;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --plane:#0b0e13; --surface:#141922; --surface-2:#1a202a; --surface-3:#222936;
  --ink:#f2f6fa; --ink-2:#a9b5c5; --ink-3:#7b8797;
  --line:#252c38; --line-soft:#1e242e;
  --ocean:#0f141b; --graticule:#1c2430; --nodata:#2b323e; --land-stroke:#0d1218;
  --accent:#6da7ec; --accent-soft:rgba(109,167,236,.14);
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.45);
  --c1:#14355f; --c2:#17518f; --c3:#1c5cab; --c4:#2a78d6;
  --c5:#3987e5; --c6:#5598e7; --c7:#86b6ef; --c8:#cde2fb;
  --on-hi:#0b1622;
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--plane); color:var(--ink);
  font-family:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
h1,h2,h3{margin:0; font-family:"IBM Plex Sans Condensed","IBM Plex Sans",system-ui,sans-serif; font-weight:600; text-wrap:balance}
button{font:inherit; color:inherit}
.num{font-family:"IBM Plex Mono", ui-monospace, monospace; font-variant-numeric:tabular-nums}
.eyebrow{font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-3); font-weight:600}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:4px}

/* ---------- shell ---------- */
.app{display:flex; flex-direction:column; height:100vh; height:100dvh; min-height:520px}
.topbar{
  display:flex; align-items:center; gap:20px; flex-wrap:wrap;
  padding:12px 18px; background:var(--surface); border-bottom:1px solid var(--line);
}
.brand{display:flex; align-items:center; gap:11px; min-width:190px}
.brand .mark{
  width:30px; height:30px; border-radius:50%; flex:none;
  background:
    linear-gradient(var(--accent),var(--accent)) center/100% 1px no-repeat,
    linear-gradient(var(--accent),var(--accent)) center/1px 100% no-repeat;
  border:1.5px solid var(--accent); opacity:.9;
}
.brand h1{font-size:16.5px; letter-spacing:.01em}
.brand p{margin:0; font-size:11.5px; color:var(--ink-3)}

.switcher{display:flex; gap:4px; padding:3px; background:var(--surface-2); border:1px solid var(--line); border-radius:9px; overflow-x:auto; scrollbar-width:none}
.switcher::-webkit-scrollbar{display:none}
.switcher button{
  border:0; background:transparent; padding:6px 13px; border-radius:6px; cursor:pointer;
  font-size:13px; font-weight:500; color:var(--ink-2); white-space:nowrap;
  transition:background .16s ease, color .16s ease;
}
.switcher button:hover{background:var(--surface-3); color:var(--ink)}
.switcher button[aria-selected="true"]{background:var(--accent); color:var(--on-hi); box-shadow:0 1px 2px rgba(0,0,0,.16)}
.search{margin-left:auto; display:flex; align-items:center; gap:8px}
.search input{
  width:200px; padding:7px 11px; border-radius:8px; border:1px solid var(--line);
  background:var(--surface-2); color:var(--ink); font:inherit; font-size:13px;
}
.search input::placeholder{color:var(--ink-3)}

main{flex:1; display:grid; grid-template-columns:minmax(0,1fr) 348px; min-height:0}

/* ---------- map stage ---------- */
.stage{position:relative; min-width:0; background:var(--plane); overflow:hidden}
#map{display:block; width:100%; height:100%; touch-action:none; cursor:grab}
#map.dragging{cursor:grabbing}
.sphere{fill:var(--ocean)}
.graticule{fill:none; stroke:var(--graticule); stroke-width:.6; vector-effect:non-scaling-stroke}
.sphere-edge{fill:none; stroke:var(--graticule); stroke-width:1; vector-effect:non-scaling-stroke}
.country{
  fill:var(--nodata); stroke:var(--land-stroke); stroke-width:.55;
  vector-effect:non-scaling-stroke; cursor:pointer;
  transition:fill .35s ease, opacity .18s ease;
}
.country.b1{fill:var(--c1)} .country.b2{fill:var(--c2)} .country.b3{fill:var(--c3)} .country.b4{fill:var(--c4)}
.country.b5{fill:var(--c5)} .country.b6{fill:var(--c6)} .country.b7{fill:var(--c7)} .country.b8{fill:var(--c8)}
.country.nd{fill:var(--nodata); cursor:default}
.country.hot{stroke:var(--ink); stroke-width:1.4}
.country.sel{stroke:var(--ink); stroke-width:2.2}
#world.focusing .country:not(.match){opacity:.22}
@media (prefers-reduced-motion: reduce){ .country{transition:none} }

/* floating cards over the map */
.legend, .zoomctl, .hint{position:absolute; z-index:2}
.legend{
  left:16px; bottom:16px; background:var(--surface); border:1px solid var(--line);
  border-radius:11px; padding:12px 14px 11px; box-shadow:var(--shadow); width:308px; max-width:calc(100% - 32px);
}
.legend .lg-title{font-size:12.5px; font-weight:600; margin-bottom:2px}
.legend .lg-unit{font-size:11px; color:var(--ink-3); margin-bottom:9px}
.ramp{display:flex; gap:2px}
.ramp button{
  flex:1; height:13px; border:0; border-radius:2px; padding:0; cursor:pointer; min-width:16px;
  transition:transform .14s ease;
}
.ramp button:hover{transform:scaleY(1.45)}
.ramp button.s1{background:var(--c1)} .ramp button.s2{background:var(--c2)}
.ramp button.s3{background:var(--c3)} .ramp button.s4{background:var(--c4)}
.ramp button.s5{background:var(--c5)} .ramp button.s6{background:var(--c6)}
.ramp button.s7{background:var(--c7)} .ramp button.s8{background:var(--c8)}
.ticks{display:flex; margin-top:5px; font-size:10px; color:var(--ink-3); height:13px}
.ticks span{flex:1; position:relative}
.ticks span i{position:absolute; left:0; transform:translateX(-50%); font-style:normal; white-space:nowrap}
.legend .nd-row{display:flex; align-items:center; gap:7px; margin-top:9px; font-size:11px; color:var(--ink-3)}
.legend .nd-swatch{width:13px; height:13px; border-radius:2px; background:var(--nodata); border:1px solid var(--line)}

.zoomctl{right:16px; bottom:16px; display:flex; flex-direction:column; gap:1px; border-radius:10px; overflow:hidden; box-shadow:var(--shadow); border:1px solid var(--line)}
.zoomctl button{
  width:34px; height:34px; border:0; background:var(--surface); cursor:pointer;
  display:grid; place-items:center; font-size:16px; color:var(--ink-2); line-height:1;
  border-bottom:1px solid var(--line-soft);
}
.zoomctl button:last-child{border-bottom:0; font-size:12px}
.zoomctl button:hover{background:var(--surface-3); color:var(--ink)}
.hint{left:16px; top:14px; margin:0; font-size:11px; color:var(--ink-2); pointer-events:none;
  background:var(--surface); border:1px solid var(--line); border-radius:20px; padding:5px 12px; box-shadow:var(--shadow)}

#tooltip{
  position:absolute; z-index:5; pointer-events:none; opacity:0; transform:translateY(3px);
  transition:opacity .12s ease, transform .12s ease;
  background:var(--surface); border:1px solid var(--line); border-radius:9px;
  padding:8px 11px; box-shadow:var(--shadow); min-width:120px; max-width:230px;
}
#tooltip.on{opacity:1; transform:translateY(0)}
#tooltip .tt-name{font-size:13px; font-weight:600; line-height:1.25}
#tooltip .tt-val{font-size:16px; margin-top:3px; font-weight:500}
#tooltip .tt-lab{font-size:10.5px; color:var(--ink-3); letter-spacing:.04em; text-transform:uppercase}

/* ---------- side panel ---------- */
.panel{
  background:var(--surface); border-left:1px solid var(--line);
  overflow-y:auto; padding:20px 20px 28px; display:flex; flex-direction:column; gap:18px;
}
.panel > *{flex:0 0 auto}
.panel-empty .lead{font-size:13px; color:var(--ink-2); margin:6px 0 0}
.panel h2{font-size:23px; letter-spacing:-.01em; line-height:1.15}
.pnl-head{display:flex; justify-content:space-between; align-items:flex-start; gap:12px}
.close-btn{border:1px solid var(--line); background:var(--surface-2); border-radius:7px; width:26px; height:26px; cursor:pointer; color:var(--ink-3); flex:none; font-size:14px; line-height:1}
.close-btn:hover{color:var(--ink); background:var(--surface-3)}

.hero{border:1px solid var(--line); border-radius:12px; padding:14px 15px; background:var(--surface-2)}
.hero .hero-lab{display:flex; justify-content:space-between; align-items:baseline; gap:8px}
.hero .val{font-size:34px; font-weight:500; letter-spacing:-.02em; line-height:1.05; margin-top:6px}
.hero .val small{font-size:15px; color:var(--ink-2); font-weight:400; margin-left:4px}
.rankchip{
  font-size:11px; padding:3px 8px; border-radius:20px; background:var(--accent-soft);
  color:var(--accent); font-weight:600; white-space:nowrap;
}
.scaleline{margin-top:13px}
.scaleline .track{position:relative; height:6px; border-radius:3px; background:linear-gradient(90deg,var(--c1),var(--c4),var(--c8))}
.scaleline .knob{position:absolute; top:-4px; width:3px; height:14px; border-radius:2px; background:var(--ink); box-shadow:0 0 0 2px var(--surface-2)}
.scaleline .med{position:absolute; top:-2px; width:1px; height:10px; background:var(--ink-3)}
.scaleline .ends{display:flex; justify-content:space-between; margin-top:6px; font-size:10.5px; color:var(--ink-3)}

.rows{display:flex; flex-direction:column; gap:0; border:1px solid var(--line); border-radius:12px; overflow:hidden}
.row{display:grid; grid-template-columns:1fr auto; gap:2px 10px; padding:11px 14px; border-bottom:1px solid var(--line-soft); cursor:pointer; background:none; border-left:0; border-right:0; border-top:0; text-align:left; width:100%}
.row:last-child{border-bottom:0}
.row:hover{background:var(--surface-2)}
.row[aria-current="true"]{background:var(--accent-soft)}
.row .r-lab{font-size:12.5px; color:var(--ink-2)}
.row .r-val{font-size:13.5px; font-weight:500}
.row .r-bar{grid-column:1/-1; height:4px; border-radius:2px; background:var(--surface-3); overflow:hidden; margin-top:5px}
.row .r-bar i{display:block; height:100%; border-radius:2px; background:var(--accent); transition:width .4s ease}
.row .r-rank{font-size:10.5px; color:var(--ink-3)}

.stats{display:grid; grid-template-columns:1fr 1fr; gap:1px; background:var(--line); border:1px solid var(--line); border-radius:12px; overflow:hidden}
.stat{background:var(--surface); padding:11px 13px}
.stat .s-lab{font-size:10.5px; color:var(--ink-3); text-transform:uppercase; letter-spacing:.08em; font-weight:600}
.stat .s-val{font-size:17px; font-weight:500; margin-top:3px}
.stat .s-val.range{font-size:13.5px; white-space:nowrap}
.stat .s-sub{font-size:11px; color:var(--ink-3)}

.listcard h3{font-size:12.5px; margin-bottom:8px}
.rank-list{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:2px}
.rank-list button{
  width:100%; display:grid; grid-template-columns:20px 1fr auto; align-items:center; gap:9px;
  border:0; background:none; padding:5px 7px; border-radius:7px; cursor:pointer; text-align:left;
}
.rank-list button:hover{background:var(--surface-2)}
.rank-list .r-i{font-size:11px; color:var(--ink-3)}
.rank-list .r-n{font-size:12.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.rank-list .r-v{font-size:12px; color:var(--ink-2)}
.rank-list .sw{display:inline-block; width:8px; height:8px; border-radius:2px; margin-right:6px; vertical-align:middle}

.actions{display:flex; gap:8px}
.actions button{
  flex:1; padding:9px 12px; border-radius:9px; border:1px solid var(--line);
  background:var(--surface-2); cursor:pointer; font-size:12.5px; font-weight:500;
}
.actions button:hover{background:var(--surface-3)}
.actions button.primary{background:var(--accent); border-color:var(--accent); color:var(--on-hi)}
.actions button.primary:hover{filter:brightness(1.08)}
.footnote{font-size:11px; color:var(--ink-3); border-top:1px solid var(--line-soft); padding-top:12px; margin-top:auto}

@media (max-width: 900px){
  main{grid-template-columns:1fr; grid-template-rows:minmax(320px,1fr) auto}
  .panel{border-left:0; border-top:1px solid var(--line); max-height:46vh}
  .search{width:100%; margin-left:0}
  .search .eyebrow{display:none}
  .search input{width:100%}
  .legend{width:auto; right:12px; left:12px; bottom:12px; padding:9px 12px}
  .legend .lg-unit{margin-bottom:7px}
  .legend .nd-row{display:none}
  .zoomctl{bottom:auto; top:12px; right:12px; flex-direction:row}
  .zoomctl button{border-bottom:0; border-right:1px solid var(--line-soft)}
  .zoomctl button:last-child{border-right:0}
  .hint{display:none}
}
</style>

<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="mark" aria-hidden="true"></div>
      <div>
        <h1>Dünya Metrik Atlası</h1>
        <p><span id="coverage">189</span> ülke · örnek veri seti</p>
      </div>
    </div>

    <div class="switcher" id="switcher" role="tablist" aria-label="Metrik seçimi"></div>

    <div class="search">
      <label class="eyebrow" for="q">Ülke ara</label>
      <input id="q" list="country-list" placeholder="Türkiye, Japonya…" autocomplete="off">
      <datalist id="country-list"></datalist>
    </div>
  </header>

  <main>
    <section class="stage" id="stage">
      <svg id="map" role="img" aria-label="Ülkelere göre renklendirilmiş dünya haritası"></svg>
      <p class="hint">Sürükleyerek gezin · tekerlekle yakınlaştırın · ülkeye tıklayın</p>

      <div class="legend" id="legend">
        <div class="lg-title" id="lg-title">—</div>
        <div class="lg-unit" id="lg-unit">—</div>
        <div class="ramp" id="ramp"></div>
        <div class="ticks" id="ticks"></div>
        <div class="nd-row"><span class="nd-swatch"></span> Veri yok</div>
      </div>

      <div class="zoomctl">
        <button id="zin" title="Yakınlaştır" aria-label="Yakınlaştır">+</button>
        <button id="zout" title="Uzaklaştır" aria-label="Uzaklaştır">−</button>
        <button id="zreset" title="Görünümü sıfırla" aria-label="Görünümü sıfırla">⟲</button>
      </div>

      <div id="tooltip" role="status" aria-live="polite"></div>
    </section>

    <aside class="panel" id="panel"></aside>
  </main>
</div>

document.documentElement.lang = "tr";

  document.head.appendChild(mv);

/* ---------------- data model ---------------- */
const REGIONS = {EU:"Avrupa", AS:"Asya", ME:"Orta Doğu", AF:"Afrika", NA:"Kuzey Amerika", SA:"Güney Amerika", OC:"Okyanusya"};

const nf = (v, d=0) => v.toLocaleString("tr-TR", {minimumFractionDigits:d, maximumFractionDigits:d});

const METRICS = [
  { key:"gdp", label:"Kişi başı gelir", short:"Gelir", unit:"ABD doları / kişi",
    desc:"Kişi başına düşen yıllık gelirin ülkeler arasındaki dağılımı.",
    bins:[1000,2500,6000,12000,25000,45000,70000],
    fmt:v => "$" + nf(v), axis:v => nf(v) },
  { key:"life", label:"Yaşam beklentisi", short:"Yaşam", unit:"doğumda beklenen yıl",
    desc:"Doğumda beklenen ortalama yaşam süresi.",
    bins:[60,65,70,73,76,79,82],
    fmt:v => nf(v,1) + " yıl", axis:v => nf(v,0) },
  { key:"pop", label:"Nüfus", short:"Nüfus", unit:"milyon kişi",
    desc:"Toplam nüfus. Ölçek geniş olduğu için aralıklar logaritmik genişler.",
    bins:[1,5,15,40,100,250,700],
    fmt:v => v < 1 ? nf(v*1000,0) + " bin kişi" : nf(v,1) + " mn kişi",
    axis:v => nf(v) },
  { key:"net", label:"İnternet erişimi", short:"İnternet", unit:"nüfusun yüzdesi",
    desc:"İnternet kullanan nüfusun payı.",
    bins:[20,35,50,65,80,90,95],
    fmt:v => "%" + nf(v), axis:v => "%"+v },
  { key:"co2", label:"Kişi başı CO₂", short:"CO₂", unit:"ton / kişi / yıl",
    desc:"Kişi başına düşen yıllık karbondioksit salımı.",
    bins:[0.3,1,2,4,7,11,16],
    fmt:v => nf(v, v<1?2:1) + " t", axis:v => nf(v, v<1?1:0) }
];
const M = Object.fromEntries(METRICS.map(m => [m.key, m]));

const COUNTRIES = new Map();
for (const line of RAW.trim().split("\n")) {
  const [name, region, pop, gdp, life, net, co2] = line.split("|");
  COUNTRIES.set(name, {
    name, tr: TRN[name] || name, region,
    v: {pop:+pop, gdp:+gdp, life:+life, net:+net, co2:+co2}
  });
}

/* ranks (1 = highest) and percentile per metric */
const RANKS = {};
for (const m of METRICS) {
  const sorted = [...COUNTRIES.values()].sort((a,b) => b.v[m.key] - a.v[m.key]);
  const map = new Map();
  sorted.forEach((c,i) => map.set(c.name, i+1));
  RANKS[m.key] = {rank:map, sorted, n:sorted.length,
                  median: sorted[Math.floor(sorted.length/2)].v[m.key]};
}
const TOTAL = COUNTRIES.size;
document.getElementById("coverage").textContent = TOTAL;

const binOf = (m, v) => { let i = 0; while (i < m.bins.length && v >= m.bins[i]) i++; return i + 1; };

/* ---------------- map: pre-projected paths (Natural Earth) ---------------- */
const NS = "http://www.w3.org/2000/svg";
const [VX, VY, VW, VH] = PATHS.vb;
const svg = document.getElementById("map");
svg.setAttribute("viewBox", PATHS.vb.join(" "));
svg.setAttribute("preserveAspectRatio", "xMidYMid meet");

const zoomG = document.createElementNS(NS, "g");
svg.appendChild(zoomG);

function addPath(d, cls) {
  const el = document.createElementNS(NS, "path");
  el.setAttribute("d", d); el.setAttribute("class", cls);
  zoomG.appendChild(el); return el;
}
addPath(PATHS.sphere, "sphere");
addPath(PATHS.grat, "graticule");

const world = document.createElementNS(NS, "g");
world.id = "world";
zoomG.appendChild(world);
addPath(PATHS.sphere, "sphere-edge");

const NODES = new Map();          // country name -> {el, bbox, data}
for (const feat of PATHS.f) {
  const el = document.createElementNS(NS, "path");
  el.setAttribute("d", feat.d);
  el.setAttribute("class", "country nd");
  el.dataset.name = feat.n;
  const data = COUNTRIES.get(feat.n);
  el.setAttribute("tabindex", data ? "0" : "-1");
  el.setAttribute("role", data ? "button" : "presentation");
  world.appendChild(el);
  NODES.set(feat.n, {el, bbox:{x:feat.b[0], y:feat.b[1], w:feat.b[2], h:feat.b[3]}, data});
}

/* ---------------- state ---------------- */
let metric = "gdp";
let selected = null;
let highlightBin = 0;

function label(name){ const n = NODES.get(name); return (n && n.data) ? n.data.tr : (TRN[name] || name); }

function paint() {
  const m = M[metric];
  for (const [name, node] of NODES) {
    const cls = ["country"];
    if (node.data) cls.push("b" + binOf(m, node.data.v[metric]));
    else cls.push("nd");
    if (name === selected) cls.push("sel");
    if (highlightBin && node.data && binOf(m, node.data.v[metric]) === highlightBin) cls.push("match");
    node.el.setAttribute("class", cls.join(" "));
  }
  world.classList.toggle("focusing", !!highlightBin);
}

/* ---------------- metric switcher ---------------- */
const switcher = document.getElementById("switcher");
for (const m of METRICS) {
  const b = document.createElement("button");
  b.type = "button"; b.role = "tab"; b.textContent = m.label; b.dataset.key = m.key;
  b.addEventListener("click", () => setMetric(m.key));
  switcher.appendChild(b);
}
function setMetric(key) {
  metric = key; highlightBin = 0;
  for (const b of switcher.children) b.setAttribute("aria-selected", String(b.dataset.key === key));
  paint(); drawLegend(); renderPanel();
}

/* ---------------- legend ---------------- */
const ramp = document.getElementById("ramp"), ticks = document.getElementById("ticks");
function drawLegend() {
  const m = M[metric];
  document.getElementById("lg-title").textContent = m.label;
  document.getElementById("lg-unit").textContent = m.unit;
  ramp.innerHTML = ""; ticks.innerHTML = "";
  for (let i = 1; i <= 8; i++) {
    const b = document.createElement("button");
    b.type = "button"; b.className = "s" + i;
    const lo = i === 1 ? null : m.bins[i-2], hi = i === 8 ? null : m.bins[i-1];
    b.title = (lo === null ? "< " + m.fmt(hi) : hi === null ? "≥ " + m.fmt(lo) : m.fmt(lo) + " – " + m.fmt(hi));
    b.setAttribute("aria-label", b.title);
    b.addEventListener("mouseenter", () => { highlightBin = i; paint(); });
    b.addEventListener("mouseleave", () => { highlightBin = 0; paint(); });
    b.addEventListener("focus", () => { highlightBin = i; paint(); });
    b.addEventListener("blur", () => { highlightBin = 0; paint(); });
    ramp.appendChild(b);
  }
  for (let i = 1; i <= 8; i++) {
    const cell = document.createElement("span");
    if (i > 1 && (i % 2 === 1 || m.bins.length < 4)) {
      const t = document.createElement("i");
      t.className = "num"; t.textContent = m.axis(m.bins[i-2]);
      cell.appendChild(t);
    }
    ticks.appendChild(cell);
  }
}

/* ---------------- tooltip ---------------- */
const tip = document.getElementById("tooltip"), stage = document.getElementById("stage");
let hoverName = null;
function showTip(name, clientX, clientY) {
  const node = NODES.get(name); if (!node) return;
  const m = M[metric];
  tip.innerHTML = node.data
    ? `<div class="tt-name">${label(name)}</div>
       <div class="tt-val num">${m.fmt(node.data.v[metric])}</div>
       <div class="tt-lab">${m.label} · ${RANKS[metric].rank.get(name)}. sıra</div>`
    : `<div class="tt-name">${label(name)}</div><div class="tt-lab">Veri yok</div>`;
  const r = stage.getBoundingClientRect();
  let x = clientX - r.left + 16, y = clientY - r.top + 16;
  if (x + 240 > r.width) x = clientX - r.left - 240;
  if (y + 90 > r.height) y = clientY - r.top - 96;
  tip.style.left = x + "px"; tip.style.top = y + "px";
  tip.classList.add("on");
}
function hideTip() { tip.classList.remove("on"); }

svg.addEventListener("pointermove", e => {
  if (dragging) { hideTip(); return; }
  const t = e.target.closest ? e.target.closest(".country") : null;
  if (!t) { hoverName = null; hideTip(); if (lastHot) { lastHot.classList.remove("hot"); lastHot = null; } return; }
  const name = t.dataset.name;
  if (name !== hoverName) {
    if (lastHot) lastHot.classList.remove("hot");
    t.classList.add("hot"); lastHot = t; hoverName = name;
  }
  showTip(name, e.clientX, e.clientY);
});
let lastHot = null;
svg.addEventListener("pointerleave", () => { hideTip(); if (lastHot) { lastHot.classList.remove("hot"); lastHot = null; } hoverName = null; });

/* ---------------- selection ---------------- */
function select(name, focus) {
  const node = NODES.get(name);
  if (!node || !node.data) return;
  selected = name;
  paint();
  node.el.parentNode.appendChild(node.el);   // draw the selected outline on top
  renderPanel();
  if (focus) focusCountry(name);
}
function clearSelection() { selected = null; paint(); renderPanel(); }

svg.addEventListener("click", e => {
  if (moved) return;
  const under = document.elementFromPoint(e.clientX, e.clientY);
  const t = under && under.closest ? under.closest(".country") : null;
  if (t && NODES.get(t.dataset.name).data) select(t.dataset.name);
  else clearSelection();
});
svg.addEventListener("keydown", e => {
  const t = e.target.closest ? e.target.closest(".country") : null;
  if (t && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); select(t.dataset.name, true); }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") { clearSelection(); hideTip(); }
  if (e.target.tagName === "INPUT") return;
  if (e.key === "+" || e.key === "=") zoomBy(1.4);
  if (e.key === "-") zoomBy(1/1.4);
});

/* ---------------- pan & zoom ---------------- */
let view = {k:1, x:0, y:0};
const K_MIN = 1, K_MAX = 14;

/* the slice of base viewBox space the viewport actually shows (before the zoom transform) */
function visibleBox() {
  const ctm = svg.getScreenCTM();
  const r = svg.getBoundingClientRect();
  if (!ctm || !ctm.a) return {x0:VX, y0:VY, x1:VX+VW, y1:VY+VH, unit:VW / Math.max(1, r.width)};
  const inv = ctm.inverse();
  const p = svg.createSVGPoint();
  p.x = r.left; p.y = r.top;
  const a = p.matrixTransform(inv);
  p.x = r.right; p.y = r.bottom;
  const b = p.matrixTransform(inv);
  return {x0:a.x, y0:a.y, x1:b.x, y1:b.y, unit:1 / ctm.a};
}
function toViewBox(clientX, clientY) {
  const ctm = svg.getScreenCTM();
  const p = svg.createSVGPoint();
  p.x = clientX; p.y = clientY;
  const q = p.matrixTransform(ctm.inverse());
  return [q.x, q.y];
}
function clampView(v) {
  v.k = Math.min(K_MAX, Math.max(K_MIN, v.k));
  const vis = visibleBox();
  const fit = (lo, hi, min, max, val) => {
    const upper = lo - min * v.k, lower = hi - max * v.k;
    return lower > upper ? (lo + hi) / 2 - (min + max) / 2 * v.k
                         : Math.min(upper, Math.max(lower, val));
  };
  v.x = fit(vis.x0, vis.x1, VX, VX + VW, v.x);
  v.y = fit(vis.y0, vis.y1, VY, VY + VH, v.y);
  return v;
}
function applyView() {
  zoomG.setAttribute("transform", `translate(${view.x.toFixed(2)} ${view.y.toFixed(2)}) scale(${view.k.toFixed(4)})`);
}
function scaleAbout(k1, cx, cy) {
  const k0 = view.k;
  k1 = Math.min(K_MAX, Math.max(K_MIN, k1));
  const ax = (cx - view.x) / k0, ay = (cy - view.y) / k0;
  return {k:k1, x:cx - ax * k1, y:cy - ay * k1};
}
function zoomAt(factor, clientX, clientY) {
  const [cx, cy] = toViewBox(clientX, clientY);
  animate(scaleAbout(view.k * factor, cx, cy), 200);
}
function zoomBy(factor) {
  const r = svg.getBoundingClientRect();
  zoomAt(factor, r.left + r.width/2, r.top + r.height/2);
}
svg.addEventListener("wheel", e => {
  e.preventDefault();
  const raw = e.deltaY * (e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? 400 : 1);
  const f = Math.min(1.5, Math.max(1/1.5, Math.exp(-raw * 0.0022)));
  const [cx, cy] = toViewBox(e.clientX, e.clientY);
  cancelAnim();
  view = clampView(scaleAbout(view.k * f, cx, cy));
  applyView();
}, {passive:false});

let dragging = false, moved = false, pointers = new Map(), pinch = null, start = null;
svg.addEventListener("pointerdown", e => {
  svg.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if (pointers.size === 1) {
    cancelAnim();
    dragging = true; moved = false;
    start = {cx:e.clientX, cy:e.clientY, vx:view.x, vy:view.y, unit:visibleBox().unit};
    svg.classList.add("dragging");
  } else if (pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    pinch = {d:Math.hypot(a.x-b.x, a.y-b.y), k:view.k, mx:(a.x+b.x)/2, my:(a.y+b.y)/2};
  }
});
svg.addEventListener("pointermove", e => {
  if (!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if (pointers.size === 2 && pinch) {
    const [a, b] = [...pointers.values()];
    const d = Math.hypot(a.x-b.x, a.y-b.y);
    const [cx, cy] = toViewBox(pinch.mx, pinch.my);
    view = clampView(scaleAbout(pinch.k * (d / pinch.d), cx, cy));
    applyView(); moved = true;
    return;
  }
  if (!dragging || !start) return;
  const dx = (e.clientX - start.cx) * start.unit, dy = (e.clientY - start.cy) * start.unit;
  if (Math.abs(e.clientX - start.cx) + Math.abs(e.clientY - start.cy) > 3) moved = true;
  view = clampView({k:view.k, x:start.vx + dx, y:start.vy + dy});
  applyView();
});
function endPointer(e) {
  pointers.delete(e.pointerId);
  if (pointers.size < 2) pinch = null;
  if (pointers.size === 0) { dragging = false; svg.classList.remove("dragging"); setTimeout(() => { moved = false; }, 0); }
}
svg.addEventListener("pointerup", endPointer);
svg.addEventListener("pointercancel", endPointer);
svg.addEventListener("dblclick", e => { e.preventDefault(); zoomAt(1.8, e.clientX, e.clientY); });

let raf = null;
function cancelAnim() { if (raf) { cancelAnimationFrame(raf); raf = null; } }
function animate(target, ms) {
  cancelAnim();
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const from = {...view}, to = clampView({...target});
  if (reduce || ms === 0) { view = to; applyView(); return; }
  const t0 = performance.now();
  const step = now => {
    const t = Math.min(1, (now - t0) / ms);
    const e = t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2;
    view = {k:from.k + (to.k - from.k) * e, x:from.x + (to.x - from.x) * e, y:from.y + (to.y - from.y) * e};
    applyView();
    raf = t < 1 ? requestAnimationFrame(step) : null;
  };
  raf = requestAnimationFrame(step);
}
function focusCountry(name) {
  const bb = NODES.get(name).bbox;
  const vis = visibleBox();
  const visW = vis.x1 - vis.x0, visH = vis.y1 - vis.y0;
  const k = Math.min(K_MAX, Math.max(1.3, Math.min(visW / (bb.w * 3.0), visH / (bb.h * 3.0))));
  const cx = bb.x + bb.w/2, cy = bb.y + bb.h/2;
  animate({k, x:(vis.x0 + vis.x1)/2 - cx * k, y:(vis.y0 + vis.y1)/2 - cy * k}, 620);
}
addEventListener("resize", () => { view = clampView(view); applyView(); });

document.getElementById("zin").addEventListener("click", () => zoomBy(1.6));
document.getElementById("zout").addEventListener("click", () => zoomBy(1/1.6));
document.getElementById("zreset").addEventListener("click", () => animate({k:1, x:0, y:0}, 500));

/* ---------------- side panel ---------------- */
const panel = document.getElementById("panel");
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function pct(m, v) {
  const lo = Math.min(...RANKS[m.key].sorted.map(c => c.v[m.key]));
  const hi = Math.max(...RANKS[m.key].sorted.map(c => c.v[m.key]));
  const f = x => Math.log(x + (m.key === "co2" ? 0.05 : 1));
  return Math.max(0, Math.min(1, (f(v) - f(lo)) / (f(hi) - f(lo))));
}

function renderPanel() {
  const m = M[metric];
  panel.classList.toggle("panel-empty", !selected);
  panel.innerHTML = selected ? selectedView(m) : overviewView(m);
  panel.querySelectorAll("[data-go]").forEach(el =>
    el.addEventListener("click", () => select(el.dataset.go, el.dataset.focus === "1")));
  panel.querySelectorAll("[data-metric]").forEach(el =>
    el.addEventListener("click", () => setMetric(el.dataset.metric)));
  const cl = panel.querySelector("[data-close]");
  if (cl) cl.addEventListener("click", clearSelection);
  const fc = panel.querySelector("[data-focus-btn]");
  if (fc) fc.addEventListener("click", () => focusCountry(selected));
}

function selectedView(m) {
  const c = COUNTRIES.get(selected);
  const R = RANKS[m.key], rank = R.rank.get(selected);
  const p = pct(m, c.v[m.key]), pm = pct(m, R.median);
  const regionPeers = R.sorted.filter(x => x.region === c.region);
  const regionRank = regionPeers.findIndex(x => x.name === selected) + 1;

  const rows = METRICS.map(mm => {
    const v = c.v[mm.key], r = RANKS[mm.key].rank.get(selected);
    const w = (pct(mm, v) * 100).toFixed(1);
    return `<button class="row" data-metric="${mm.key}" aria-current="${mm.key === m.key}">
        <span class="r-lab">${mm.label}</span>
        <span class="r-val num">${mm.fmt(v)}</span>
        <span class="r-rank num">${r}. / ${TOTAL}</span>
        <span class="r-bar"><i style="width:${w}%"></i></span>
      </button>`;
  }).join("");

  return `
    <div class="pnl-head">
      <div>
        <div class="eyebrow">${REGIONS[c.region]} · ${regionRank}. / ${regionPeers.length}</div>
        <h2>${esc(c.tr)}</h2>
      </div>
      <button class="close-btn" data-close aria-label="Seçimi temizle">×</button>
    </div>

    <div class="hero">
      <div class="hero-lab">
        <span class="eyebrow">${m.label}</span>
        <span class="rankchip">${TOTAL} ülke içinde ${rank}.</span>
      </div>
      <div class="val num">${m.fmt(c.v[m.key])}</div>
      <div class="scaleline">
        <div class="track">
          <span class="med" style="left:${(pm*100).toFixed(1)}%" title="Dünya medyanı"></span>
          <span class="knob" style="left:calc(${(p*100).toFixed(1)}% - 1.5px)"></span>
        </div>
        <div class="ends"><span>en düşük</span><span>medyan ${m.fmt(RANKS[m.key].median)}</span><span>en yüksek</span></div>
      </div>
    </div>

    <div>
      <div class="eyebrow" style="margin-bottom:8px">Tüm metrikler</div>
      <div class="rows">${rows}</div>
    </div>

    <div class="actions">
      <button class="primary" data-focus-btn>Haritada odakla</button>
      <button data-close>Seçimi temizle</button>
    </div>

    <p class="footnote">Değerler gösterim amaçlı hazırlanmış örnek veri setinden gelir; resmî istatistik değildir.</p>`;
}

function overviewView(m) {
  const R = RANKS[m.key];
  const top = R.sorted.slice(0, 5), bottom = R.sorted.slice(-5).reverse();
  const list = arr => `<ul class="rank-list">` + arr.map(c => {
    const b = binOf(m, c.v[m.key]);
    return `<li><button data-go="${esc(c.name)}" data-focus="1">
      <span class="r-i num">${R.rank.get(c.name)}</span>
      <span class="r-n"><span class="sw" style="background:var(--c${b})"></span>${esc(c.tr)}</span>
      <span class="r-v num">${m.fmt(c.v[m.key])}</span>
    </button></li>`;
  }).join("") + `</ul>`;

  const hi = R.sorted[0], lo = R.sorted[R.n - 1];
  return `
    <div>
      <div class="eyebrow">Seçili metrik</div>
      <h2>${m.label}</h2>
      <p class="lead">${m.desc}</p>
    </div>

    <div class="stats">
      <div class="stat"><div class="s-lab">Medyan</div><div class="s-val num">${m.fmt(R.median)}</div><div class="s-sub">${TOTAL} ülke</div></div>
      <div class="stat"><div class="s-lab">Aralık</div><div class="s-val range num">${m.fmt(lo.v[m.key])} – ${m.fmt(hi.v[m.key])}</div><div class="s-sub">en düşük – en yüksek</div></div>
    </div>

    <div class="listcard"><h3>En yüksek beş</h3>${list(top)}</div>
    <div class="listcard"><h3>En düşük beş</h3>${list(bottom)}</div>

    <p class="footnote">Bir ülkeye tıklayın ya da yukarıdan arayın; detaylar burada açılır. Değerler gösterim amaçlı örnek veridir.</p>`;
}

/* ---------------- search ---------------- */
const dl = document.getElementById("country-list");
for (const c of [...COUNTRIES.values()].sort((a,b) => a.tr.localeCompare(b.tr, "tr"))) {
  const o = document.createElement("option"); o.value = c.tr; dl.appendChild(o);
}
const byTr = new Map([...COUNTRIES.values()].map(c => [c.tr.toLocaleLowerCase("tr"), c.name]));
document.getElementById("q").addEventListener("input", e => {
  const hit = byTr.get(e.target.value.trim().toLocaleLowerCase("tr"));
  if (hit) { select(hit, true); e.target.blur(); }
});

/* ---------------- go ---------------- */
setMetric("gdp");
applyView();
</script>
